name: Todoiste
options:
  bundleIdPrefix: com.todoiste
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

fileGroups:
  - Todoiste

targets:
  Todoiste:
    type: application
    platform: macOS
    sources:
      - path: Todoiste
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoiste.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Todoiste
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Todoiste uses your microphone for Todoist voice features like Ramble.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Todoiste/Todoiste.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
    resourceFiles:
      - Todoiste/Resources/**/*.js
