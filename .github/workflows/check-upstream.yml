name: Check Store and release upstream update

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  store-release:
    # Enabled only after the unpublished signed/notarized validation succeeds.
    if: vars.STORE_RELEASES_ENABLED == 'true'
    uses: ./.github/workflows/release.yml
    with:
      publish: true
    secrets: inherit
