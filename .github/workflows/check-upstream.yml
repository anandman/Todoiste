name: Check for upstream updates

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # push the update branch
  pull-requests: write # open the PR

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch latest upstream scripts
        run: ./scripts/update-shortcuts.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet Todoiste/Resources/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes detected:"
            git diff --stat Todoiste/Resources/
          fi

      - name: Create pull request
        # Re-enabled 2026-09-05: #290 merged upstream 2026-07-31 and #287 was
        # superseded by upstream's own scrollIntoView work, so the vendored
        # scripts are plain upstream master with no local patches to clobber.
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "Update vendored todoist-shortcuts scripts"
          title: "Update todoist-shortcuts to latest upstream"
          body: |
            Automated PR: new changes detected in [mgsloan/todoist-shortcuts](https://github.com/mgsloan/todoist-shortcuts).

            Review the diff carefully — upstream changes to DOM selectors or option names
            may require updates to `bootstrap.js`.

            Checklist before merging:
            - [ ] `grep -oE "options\['[^']+'\]" Todoiste/Resources/todoist-shortcuts.js | sort -u`
                  still returns only `mouse-behavior` and `cursor-movement`. If not, update
                  `SettingsView.swift` and `injectOptions()` in `WebView.swift`.
            - [ ] `Todoiste/Resources/todoist-shortcuts.js` still contains the string
                  `Configure todoist-shortcuts options`, which `bootstrap.js` matches on.
            - [ ] Build, then reinstall to `/Applications` — Cmd+R in Xcode does NOT
                  update the installed copy. Press `?` in the app to confirm the
                  shortcuts loaded.
            - [ ] Tag a new `v*` release so the published build carries the update.
          branch: update-todoist-shortcuts
          delete-branch: true
