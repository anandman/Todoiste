name: Build and Release

# Manual only. Releases are normally cut with ./scripts/release.sh, which signs
# and notarizes locally so the Developer ID certificate never touches GitHub.
# This workflow is the fallback for when that Mac isn't available: it produces
# an ad-hoc signed DMG, which works but makes users clear Gatekeeper by hand on
# first launch. It does not run on tag push, so it cannot race a local release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the DMG to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write # required for the release step to create a Release

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Select newest Xcode
        # xcodegen emits objectVersion 77, which needs Xcode 16+. Pick the
        # newest Xcode on the image rather than trusting the default.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        # Do NOT set CODE_SIGNING_ALLOWED=NO. It skips the codesign step, so the
        # bundle ships with only the linker's ad-hoc signature and no sealed
        # resources (_CodeSignature/CodeResources). Gatekeeper then fails
        # verification outright and tells users the app is "damaged" and should be
        # moved to the Trash — which right-click > Open cannot get past. Letting it
        # ad-hoc sign normally yields a valid signature, so a quarantined download
        # gets the ordinary "unidentified developer" prompt instead.
        run: |
          xcodebuild -project Todoiste.xcodeproj -scheme Todoiste \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Verify signature
        # Fail loudly here rather than shipping something Gatekeeper calls damaged.
        run: |
          cd ./build/Build/Products/Release
          codesign --verify --deep --strict --verbose=2 Todoiste.app
          test -f Todoiste.app/Contents/_CodeSignature/CodeResources

      - name: Package App
        run: |
          cd ./build/Build/Products/Release
          mkdir -p dmg
          cp -R Todoiste.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Todoiste -srcfolder dmg -ov -format UDZO Todoiste.dmg

      # NOTE: Signing and Notarization steps will go here once the Apple Developer account is ready.
      # These require certificates stored in GitHub Secrets.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ./build/Build/Products/Release/Todoiste.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
