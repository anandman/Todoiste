name: Signed release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after checks (false builds an unpublished validation artifact)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

# Shared by manual and scheduled runs; never interrupt signing/publication.
concurrency:
  group: todoiste-signed-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  gate:
    if: github.repository == 'anandman/Todoiste' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.gate.outputs.pending }}
      store_version: ${{ steps.gate.outputs.store_version }}
      source_digest: ${{ steps.gate.outputs.source_digest }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release gates
        run: python3 -m unittest discover -s tests -v
      - name: Check live Store and prepare pinned update
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/store-release.py prepare --check-release --output "$GITHUB_OUTPUT"
      - name: Record decision
        env:
          PENDING: ${{ steps.gate.outputs.pending }}
          TAG: ${{ steps.gate.outputs.tag }}
          STORE_VERSION: ${{ steps.gate.outputs.store_version }}
        run: echo "Store version $STORE_VERSION; candidate $TAG; release pending=$PENDING" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: gate
    if: needs.gate.outputs.pending == 'true' || !inputs.publish
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reproduce the checked source
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_VERSION: ${{ needs.gate.outputs.store_version }}
          EXPECTED_DIGEST: ${{ needs.gate.outputs.source_digest }}
        run: |
          python3 scripts/store-release.py prepare --expected-store-version "$STORE_VERSION" --output "$RUNNER_TEMP/prepared.txt"
          grep -Fx "source_digest=$EXPECTED_DIGEST" "$RUNNER_TEMP/prepared.txt"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import signing credentials into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name, env in [('signing.p12', 'P12_BASE64'), ('notary.p8', 'NOTARY_BASE64')]:
              Path(os.environ['RUNNER_TEMP'], name).write_bytes(base64.b64decode(os.environ[env], validate=True))
          PY
          KEYCHAIN="$RUNNER_TEMP/todoiste-signing.keychain-db"
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/signing.p12"
      - name: Build, smoke test, notarize, and verify Gatekeeper
        env:
          SIGNING_IDENTITY: CA09AB97D61BE1F8D0B376A11D7236C25D57A8C6
          SIGNING_KEYCHAIN: ${{ runner.temp }}/todoiste-signing.keychain-db
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: ./scripts/ci-release.sh
      - name: Delete temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/todoiste-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
      - name: Save verified build and checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ needs.gate.outputs.tag }}-${{ github.run_id }}
          path: |
            build/Build/Products/Release/Todoiste.dmg
            build/Todoiste.dmg.sha256
            build/notarization.json
            build/signature.txt
            build/entitlements.txt
            build/launch.log
          if-no-files-found: error
          retention-days: 7
      - name: Commit checked update and publish the verified DMG
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/store-release.py publish
      - name: Record result
        env:
          PUBLISH: ${{ inputs.publish }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          echo "Verified universal Developer ID build $TAG; notarization Accepted; staple and Gatekeeper passed; publish=$PUBLISH." >> "$GITHUB_STEP_SUMMARY"
